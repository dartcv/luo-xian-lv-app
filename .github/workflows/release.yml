name: release

on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luoxianlv-release.jks"
      - run: ./gradlew assembleRelease \
          -PreleaseStoreFile="$RUNNER_TEMP/luoxianlv-release.jks" \
          -PreleaseStorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
          -PreleaseKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
          -PreleaseKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release.sha256
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/app-release.apk app-release.sha256 \
            --repo "$GITHUB_REPOSITORY" --generate-notes --title "落弦律 ${GITHUB_REF_NAME}"
